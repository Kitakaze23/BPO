<style>
:root{--card:rgba(255,255,255,.94);--ink:#2f353b;--mut:#6e777f;--line:#e6e9ec;--soft:#f1f3f5;--pri:#4b5560;--pri2:#7c858e;--warn:#e28a06;--bad:#e5484d;--info:#21A038;--vio:#7c5cff;--sh:0 1px 1px rgba(47,53,59,.04),0 4px 10px -2px rgba(47,53,59,.06),0 18px 36px -14px rgba(47,53,59,.16);color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#e9ecef;color:var(--ink);font:400 15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,a{font:inherit;color:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button{background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:10px}
.app{position:relative;height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(90% 40% at 0% 0%,#dfe3e6 0,transparent 65%),radial-gradient(80% 38% at 100% 8%,#e6e9ec 0,transparent 65%),#f3f4f5}
@media(min-width:520px){.app{height:min(880px,calc(100dvh - 48px));margin:24px auto;border-radius:44px;box-shadow:0 0 0 9px #2f353b,0 40px 90px -30px rgba(47,53,59,.55)}}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}.scroll::-webkit-scrollbar{display:none}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 12px;background:rgba(240,245,246,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
header.top h1{font-size:clamp(18px,5.4vw,22px);font-weight:750;letter-spacing:-.02em;line-height:1.15}
header.top .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.grow{flex:1;min-width:0}
.ib{width:40px;height:40px;border-radius:14px;background:linear-gradient(#fff,#f4f5f6);display:grid;place-items:center;box-shadow:var(--sh);border:1px solid #fff;position:relative;flex:none}.ib svg{width:20px;height:20px}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff}
main{padding:4px 14px 8px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);backdrop-filter:blur(10px);border-radius:24px;padding:18px;box-shadow:var(--sh);border:1px solid rgba(255,255,255,.95);min-width:0}
.card h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.mut{color:var(--mut)}.xs{font-size:12.5px}.pos{color:var(--pri)}.neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px}
a.card,button.card{display:block;width:100%;transition:transform .15s,box-shadow .15s}a.card:active,button.card:active{transform:scale(.985)}
.chev{width:18px;height:18px;color:var(--mut);flex:none}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:30px;padding:22px 16px 6px;display:block;background:radial-gradient(120% 70% at 95% -10%,rgba(255,255,255,.32),transparent 55%),radial-gradient(60% 50% at 0% 100%,rgba(47,179,74,.5),transparent 70%),linear-gradient(155deg,#137a2b 0%,#21A038 55%,#2fb34a 100%);box-shadow:0 26px 40px -20px rgba(19,122,43,.65),0 2px 0 rgba(255,255,255,.35) inset}
.hero .mut,.hero .xs.mut{color:rgba(255,255,255,.78)}
.ring{position:relative;width:min(224px,58vw);aspect-ratio:1;margin:0 auto}.ring:before{content:"";position:absolute;inset:11%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.2),transparent)}
.ring svg{position:relative;width:100%;height:100%;transform:rotate(-90deg)}.ring .tr{stroke:rgba(255,255,255,.22)}
.ring .pg{stroke:url(#g);stroke-dasharray:502;stroke-dashoffset:502;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring b{font-size:clamp(52px,17vw,70px);font-weight:800;letter-spacing:-.05em;line-height:1;text-shadow:0 4px 16px rgba(0,0,0,.18)}
.ring .st{font-size:13px;margin-top:6px;color:rgba(255,255,255,.85)}.ring .wk{font-size:12.5px;font-weight:650;margin-top:6px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
.link{display:flex;justify-content:center;align-items:center;gap:4px;padding:13px 0;font-size:13px;font-weight:650;color:#fff}.link svg{width:15px;height:15px}
.lvl{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:20px;padding:14px 12px 10px;margin-top:6px;backdrop-filter:blur(6px)}
.steps{--sl:#dfe3e6;--sf:linear-gradient(90deg,#4b5560,#7c858e);--sn:#dfe3e6;--sd:#7c858e;--sc:#4b5560;--st:#6e777f;display:flex;margin-top:14px;position:relative}
.hero .steps{--sl:rgba(255,255,255,.25);--sf:#fff;--sn:rgba(255,255,255,.35);--sd:#fff;--sc:#fff;--st:rgba(255,255,255,.78)}
.steps:before{content:"";position:absolute;left:12.5%;right:12.5%;top:8px;height:3px;background:var(--sl);border-radius:3px}
.steps:after{content:"";position:absolute;left:12.5%;top:8px;height:3px;width:37.5%;background:var(--sf);border-radius:3px}
.step{flex:1;text-align:center;font-size:11.5px;position:relative;color:var(--st);z-index:1}
.step i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 8px;background:var(--sd)}
.step.c i{box-shadow:0 0 0 5px color-mix(in srgb,var(--sd) 30%,transparent)}.step.l i{background:transparent;border:2px dashed var(--sn)}
.step.c{color:var(--sc);font-weight:700}.step.l{opacity:.7}
.ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,#2fb34a,#21A038);box-shadow:0 8px 16px -6px rgba(53,99,255,.55),0 1px 0 rgba(255,255,255,.4) inset}.ico svg{width:22px;height:22px}
.metric{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);width:100%}.metric:first-child{border-top:0}
.mv{font-size:26px;font-weight:780;letter-spacing:-.03em;width:44px}
.bar{height:7px;border-radius:7px;background:var(--soft);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:7px}
.good{background:linear-gradient(90deg,#4b5560,#7c858e)}.warn{background:linear-gradient(90deg,#e28a06,#f5b73f)}.bad{background:linear-gradient(90deg,#e5484d,#ff7a7e)}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.pill.risk,.pill.hi{background:rgba(229,72,77,.12);color:var(--bad)}.pill.mid{background:rgba(226,138,6,.15);color:var(--warn)}.pill.ok{background:rgba(107,117,127,.16);color:var(--pri)}.pill.info{background:rgba(53,99,255,.12);color:var(--info)}
.li{display:flex;gap:10px;padding:8px 0}.li:before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));margin-top:7px;flex:none}
.fac{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.fac:first-of-type{border-top:0}.fac b{font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:15px;border-radius:18px;color:#fff;font-weight:650;font-size:15px;background:linear-gradient(135deg,#4b5560,#7c858e);box-shadow:0 12px 22px -10px rgba(19,122,43,.7),0 1px 0 rgba(255,255,255,.35) inset;transition:transform .15s}.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line)}
.hero .btn.ghost{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none}
.dyn{display:flex;gap:14px;align-items:flex-end;height:130px;padding-top:8px}.dyn div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12.5px}
.dyn i{display:block;width:100%;border-radius:14px 14px 6px 6px;background:linear-gradient(#e6e9ec,#d9dde1);min-height:8px}.dyn div:last-child i{background:linear-gradient(#7c858e,#4b5560);box-shadow:0 10px 18px -8px rgba(19,122,43,.6)}.dyn b{font-size:15px}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}.note{padding:8px 0 4px;font-size:13px}
.tabs{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:2px;padding:6px;border-radius:28px;background:rgba(255,255,255,.8);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);box-shadow:0 14px 34px -10px rgba(47,53,59,.35),0 0 0 1px rgba(255,255,255,.8) inset,0 0 0 1px rgba(47,53,59,.05)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--mut);border-radius:22px;transition:background .2s,color .2s}.tabs svg{width:22px;height:22px}
.tabs .on{color:#fff;background:linear-gradient(135deg,#4b5560,#7c858e);box-shadow:0 8px 16px -6px rgba(19,122,43,.7)}
.view{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chip{flex:none;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}.chip.on{background:linear-gradient(135deg,#4b5560,#7c858e);color:#fff;border-color:transparent}.chip.k.on{background:var(--ink)}
.seg{display:flex;background:rgba(47,53,59,.06);border-radius:16px;padding:4px}.seg button{flex:1;text-align:center;padding:10px;border-radius:12px;font-weight:650;font-size:14px;color:var(--mut)}.seg .on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.msg{max-width:86%;padding:12px 14px;border-radius:20px 20px 20px 6px;background:#fff;box-shadow:var(--sh)}.msg.u{align-self:flex-end;background:linear-gradient(135deg,#4b5560,#7c858e);color:#fff;border-radius:20px 20px 6px 20px}
.msg a{display:inline-block;margin-top:10px;padding:9px 14px;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:650;font-size:13px}
.inp{display:flex;gap:8px}.inp input{flex:1;min-width:0;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;box-shadow:var(--sh)}.inp button{width:50px;border-radius:18px;background:linear-gradient(135deg,#4b5560,#7c858e);color:#fff;display:grid;place-items:center}
.sel{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}.qa a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12.5px;font-weight:650;text-align:center}
.chart{display:flex;align-items:flex-end;height:150px;margin-top:14px}.chart div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:10px;color:var(--mut)}.chart .b{width:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:7px 7px 3px 3px;overflow:hidden}.chart .b i{display:block;width:100%}
.star{font-size:26px;color:#d9dde1}.star.on{color:var(--warn)}
.sw{display:flex;align-items:center;gap:6px;font-size:10.5px;line-height:1.1;color:var(--mut)}.sw i{position:relative;width:36px;height:22px;border-radius:22px;background:#d3d7db;transition:background .2s;flex:none}.sw i:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .2s}.sw.on i{background:var(--pri)}.sw.on i:after{left:16px}
.sheet{position:absolute;inset:0;z-index:20;background:rgba(47,53,59,.42);display:flex;align-items:flex-end;animation:fade .2s}.sheet>div{width:100%;max-height:88%;overflow:auto;background:#fff;border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
.grab{display:block;width:40px;height:5px;border-radius:5px;background:#d9dde1;margin:0 auto 14px}@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sec{font-size:12.5px;color:var(--mut);margin:16px 0 4px}
@media(max-width:360px){main{padding:4px 10px}.card{padding:15px;border-radius:20px}.tabs a{font-size:10.5px}.mv{font-size:23px;width:38px}}
@media(max-height:640px){.ring{width:170px}.ring b{font-size:50px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>

<style>

else if(a=='qtg'){const c=qa[st.tb];qa[st.tb]=c.includes(v)?c.filter(x=>x!=v):(c.length<3?[...c,v]:c);qsave()}
else if(a=='qup'||a=='qdn'){const c=qa[st.tb],i=c.indexOf(v),j=a=='qup'?i-1:i+1;[c[i],c[j]]=[c[j],c[i]];qsave()}
else if(a=='pl'){st.loc=v;go('#/');return}else if(a=='au'){st.aud=1;go('#/launch/ch');return}else if(a=='tg2'){st.tg=1;go('#/');return}else if(a=='sl'){st.sale=1;go('#/launch/sale');return}else if(a=='tp'){st.launch=0;go('#/');return}
else if(a=='do'){st.fab=st.fset=0;st.tab='ai';runFlow(v);if((location.hash||'#/')!='#/chat'){location.hash='#/chat';return}}
else if(a=='cpay'){const m=st.ai[+v];m.card.done=1;st.ai.push(['a',FL[m.card.f].done(m.card.amt)]);st.stick=1}
else if(a=='cedit'){const c=st.ai[+v].card;if(c.edit){const n=+document.getElementById('ai-amt').value;if(n>0)c.amt=n;c.edit=0}else c.edit=1}
render(1);if(a=='ask')scr().scrollTop=scr().scrollHeight;});
app.addEventListener('change',e=>{if(e.target.id=='out'){st.out=+e.target.value;render(1)}if(e.target.id=='att'&&e.target.files[0]){const ai=st.tab=='ai';(ai?st.ai:st.mg).push(['u','Фото: '+e.target.files[0].name],['a',ai?'Фото получил. Разбор фото и документов в прототипе не подключён.':'Спасибо, фото получила — посмотрю и вернусь с ответом.']);st.stick=1;render(1)}});
app.addEventListener('submit',e=>{e.preventDefault();ask(e.target.querySelector('input').value);render(1);scr().scrollTop=scr().scrollHeight;document.getElementById('q').focus();});
addEventListener('hashchange',()=>{st.prod=st.step=null;st.fab=st.fset=0;render()});
const fit=()=>document.documentElement.style.setProperty('--k',innerWidth>=520?Math.min(1,(innerHeight-40)/956,(innerWidth-40)/440):1);addEventListener('resize',fit);fit();render();
</script>
